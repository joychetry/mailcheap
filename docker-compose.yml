# MailCheap and MongoDB with Docker Compose, on one server: `docker compose up -d`, or Coolify's Docker Compose
# build pack. See the README's "Docker" section.
#
# Variables written ${NAME:?...} are required. Set them in a .env file next to this one (Coolify lists every
# variable below in its Environment Variables tab). The rest are optional and documented in .env.example.
#
# No port is published: put a reverse proxy with HTTPS in front (Coolify's does this), which also keeps
# X-Forwarded-For trustworthy for the rate limits. To try it locally, add `ports: ["127.0.0.1:3000:3000"]` under app.

x-build-args: &build-args
  # Read at build time too: the docs and llms files print APP_URL, and next/image allows IMAGES_CDN_URL's host.
  APP_URL: ${APP_URL:?Set APP_URL, the public https URL of this app}
  IMAGES_CDN_URL: ${IMAGES_CDN_URL:-}

services:
  app:
    build:
      context: .
      args: *build-args
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mailcheap:${MONGO_PASSWORD:?Set MONGO_PASSWORD (openssl rand -hex 24)}@mongo:27017/mailcheap?authSource=admin
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 48)}
      SUPPRESSION_HASH_KEY: ${SUPPRESSION_HASH_KEY:?Set SUPPRESSION_HASH_KEY (openssl rand -base64 48)}
      APP_URL: ${APP_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set ADMIN_EMAILS, who signs in and opens /admin}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM, the from address of sign-in codes and alerts}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDING_ENABLED: ${SENDING_ENABLED:-false}
      SEND_RATE_PER_SECOND: ${SEND_RATE_PER_SECOND:-}
      # smtp, ses or postshiba. Empty picks postshiba with POSTSHIBA_API_KEY, else smtp with SMTP_HOST, else ses.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS_VERIFY: ${SMTP_TLS_VERIFY:-true}
      SMTP_DOMAINS: ${SMTP_DOMAINS:-}
      SES_REGION: ${SES_REGION:-us-east-1}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID:-}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY:-}
      SES_AWS_ACCOUNT_ID: ${SES_AWS_ACCOUNT_ID:-}
      SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN:-}
      # local: sends, schedules, first-send checks and purges run from a MongoDB job queue inside the app, no QStash.
      JOB_QUEUE: ${JOB_QUEUE:-local}
      QSTASH_TOKEN: ${QSTASH_TOKEN:-}
      QSTASH_CURRENT_SIGNING_KEY: ${QSTASH_CURRENT_SIGNING_KEY:-}
      QSTASH_NEXT_SIGNING_KEY: ${QSTASH_NEXT_SIGNING_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      IMAGES_S3_BUCKET: ${IMAGES_S3_BUCKET:-}
      IMAGES_S3_REGION: ${IMAGES_S3_REGION:-us-east-1}
      IMAGES_S3_ENDPOINT: ${IMAGES_S3_ENDPOINT:-}
      IMAGES_S3_ACCESS_KEY_ID: ${IMAGES_S3_ACCESS_KEY_ID:-}
      IMAGES_S3_SECRET_ACCESS_KEY: ${IMAGES_S3_SECRET_ACCESS_KEY:-}
      IMAGES_CDN_URL: ${IMAGES_CDN_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mailcheap
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD (openssl rand -hex 24)}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  mongo-data:
